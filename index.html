<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F8F4EE">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Coffee">
  <meta name="description" content="A personal log for specialty coffees, V60 recipes and how each cup turned out.">
  <title>Coffee Library</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Mono:wght@400;500&family=Figtree:wght@400..700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main id="view" aria-live="polite">
    <div class="boot"><div class="boot-mark"></div></div>
  </main>

  <nav id="tabbar" aria-label="Main">
    <a href="#/" data-tab="today">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10h13v4a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5v-4z"/><path d="M17 11.5h1.2a2.3 2.3 0 0 1 0 4.6H16.6"/><path d="M8.5 3.5c0 1.4 1 1.6 1 3M12.5 3.5c0 1.4 1 1.6 1 3"/></svg>
      <span>Today</span>
    </a>
    <a href="#/brews" data-tab="brews">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5s6 6.3 6 10.7a6 6 0 0 1-12 0C6 9.8 12 3.5 12 3.5z"/><path d="M9.5 14.5a2.6 2.6 0 0 0 2.5 2.5"/></svg>
      <span>Brews</span>
    </a>
    <a href="#/brew/new" data-tab="add" class="tab-add" aria-label="Log a brew">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </a>
    <a href="#/coffees" data-tab="coffees">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="12" rx="6.3" ry="8.8" transform="rotate(35 12 12)"/><path d="M7.6 18.3C10 15.2 9.2 13 12 12s2.2-3.4 4.4-6.3"/></svg>
      <span>Coffees</span>
    </a>
    <a href="#/recipes" data-tab="recipes">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 5.5h17"/><path d="M5 5.5 10.3 14h3.4L19 5.5"/><path d="M8 17.5h8"/><path d="M12 20v.01"/></svg>
      <span>Recipes</span>
    </a>
  </nav>

  <div id="toast" role="status"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
